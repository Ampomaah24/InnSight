options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Create .env file with Firebase config
  - name: 'bash'
    args:
    - '-c'
    - |
      cat > .env << EOF
      VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      EOF
  
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/innsight:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/innsight:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'innsight'
      - '--image'
      - 'gcr.io/$PROJECT_ID/innsight:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'


  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'innsight'
      - '--region=us-central1'
      - '--platform=managed'
      - '--member=allUsers'
      - '--role=roles/run.invoker'

images:
  - 'gcr.io/$PROJECT_ID/innsight:$COMMIT_SHA'